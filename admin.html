<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>揺れる電車｜演出設定</title>
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <header class="admin-header">
      <div>
        <p class="eyebrow">Screen Design Admin</p>
        <h1>BIAS SWING</h1>
      </div>
      <nav class="header-actions" aria-label="設定操作">
        <button id="save-config" class="button button--primary" type="button">ブラウザに保存</button>
        <button id="export-config" class="button" type="button">JSON Export</button>
        <label class="button" for="import-config">JSON Import</label>
        <input id="import-config" type="file" accept="application/json,.json" hidden />
        <button id="reset-config" class="button button--danger" type="button">初期値に戻す</button>
      </nav>
    </header>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <main class="admin-layout">
      <div class="editor-column">
        <section class="panel config-workspace">
          <div class="panel__heading">
            <div>
              <p class="eyebrow">EXPERIENCE CONFIGURATION</p>
              <h2>画面の編集</h2>
            </div>
            <div id="question-scene-actions" class="header-actions"></div>
          </div>
          <div id="config-tabs" class="config-tabs" role="tablist" aria-label="設定カテゴリ"></div>
          <div id="tab-toolbar" class="tab-toolbar"></div>
          <div id="tab-editor" class="tab-editor" role="tabpanel"></div>
        </section>
      </div>

      <aside class="preview-column">
        <section class="panel panel--sticky">
          <div class="panel__heading">
            <div>
              <p class="eyebrow">LIVE SIMULATOR</p>
              <h2>プレビュー</h2>
            </div>
            <div class="preview-actions">
              <button id="run-preview" class="button button--primary" type="button">選択イベントからテスト</button>
              <button id="run-preview-all" class="button" type="button">最初からテスト</button>
              <button id="toggle-preview-audio" class="button" type="button" aria-pressed="false">音声：ON</button>
              <button id="open-preview" class="button" type="button">別画面</button>
            </div>
          </div>
          <p class="help">編集中の値を保存せずにテストできます。プレビュー内をクリックして、矢印キーを操作してください。</p>
          <div id="timeline" class="timeline" aria-label="画面遷移タイムライン"></div>
          <div class="preview-frame-wrap">
            <iframe id="preview-frame" title="揺れる電車 プレビュー"></iframe>
            <div id="preview-placeholder" class="preview-placeholder">「テスト実行」でシミュレーターを起動</div>
          </div>
        </section>
      </aside>
    </main>

    <script type="module" src="./admin.js"></script>
  </body>
</html>
